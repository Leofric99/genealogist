<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{title}} · GeneSleuth</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #202b37; background: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #132c42; color: white; padding: 1rem max(1.25rem, calc((100vw - 1050px) / 2)); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    header strong { letter-spacing: .02em; }
    nav { display: flex; gap: 1rem; }
    nav a { color: #d5e8f7; text-decoration: none; }
    main { max-width: 1050px; margin: 2rem auto; padding: 0 1.25rem 3rem; }
    h1 { margin-top: 0; color: #132c42; }
    h2 { color: #23465f; }
    .card { background: white; border: 1px solid #dce3e9; border-radius: 10px; padding: 1.25rem; margin: 1rem 0; box-shadow: 0 2px 8px #172b3b0b; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem; }
    button, .button { border: 0; border-radius: 6px; padding: .68rem 1rem; font: inherit; color: white; background: #176b87; cursor: pointer; text-decoration: none; }
    button.secondary { background: #40576b; }
    button.danger { background: #9d2929; }
    button:disabled { opacity: .6; cursor: wait; }
    input, textarea, select { width: 100%; padding: .7rem; margin-top: .35rem; border: 1px solid #b9c6d0; border-radius: 5px; font: inherit; }
    label { display: block; margin: 1rem 0; font-weight: 600; }
    textarea { min-height: 150px; resize: vertical; }
    progress { width: 100%; height: 1rem; accent-color: #1780a0; }
    .progress-copy { display: flex; justify-content: space-between; gap: .75rem; margin-bottom: .5rem; }
    .muted, small { color: #617383; }
    .notice { padding: .8rem; border-radius: 6px; background: #edf5f7; }
    .error { color: #9d2929; }
    .activity-log { max-height: 18rem; overflow-y: auto; padding-left: 1.5rem; }
    .activity-log li { margin: .45rem 0; }
    .activity-log time { color: #617383; font-variant-numeric: tabular-nums; margin-right: .6rem; white-space: nowrap; }
    pre { overflow: auto; white-space: pre-wrap; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: .65rem; text-align: left; border-bottom: 1px solid #e3e8ec; word-break: break-word; }
    @media (max-width: 600px) { header { align-items: flex-start; flex-direction: column; } .progress-copy { flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <strong>GeneSleuth</strong>
    <nav>{{navigation}}</nav>
  </header>
  <main>{{content}}</main>
  <script>
    async function signOut() {
      await fetch("/api/logout", { method: "POST" });
      window.location.replace("/login");
    }
  </script>
</body>
</html>
