[package]
name = "genesleuth"
version = "0.1.0"
edition = "2021"
description = "GeneSleuth: local-first genealogy document transcription and research auditing"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
governor = "0.6"
hex = "0.4"
image = { version = "0.25", default-features = true }
imageproc = "0.25"
lopdf = "0.34"
rand = "0.8"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.5", features = ["fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[dev-dependencies]
